<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#1a1a2e"/>

  <!-- Clipboard body -->
  <rect x="130" y="100" width="252" height="310" rx="20" fill="none" stroke="#f0a500" stroke-width="18"/>

  <!-- Clipboard top clip -->
  <rect x="206" y="82" width="100" height="42" rx="12" fill="#1a1a2e" stroke="#f0a500" stroke-width="16"/>

  <!-- Row 1: checkbox + line -->
  <rect x="168" y="185" width="28" height="28" rx="6" fill="none" stroke="#f0a500" stroke-width="12"/>
  <line x1="218" y1="199" x2="344" y2="199" stroke="#f0a500" stroke-width="14" stroke-linecap="round"/>

  <!-- Row 2: checkbox checked + line -->
  <rect x="168" y="243" width="28" height="28" rx="6" fill="#f0a500"/>
  <polyline points="172,257 181,267 194,249" fill="none" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="218" y1="257" x2="344" y2="257" stroke="#f0a500" stroke-width="14" stroke-linecap="round"/>

  <!-- Row 3: checkbox + line -->
  <rect x="168" y="301" width="28" height="28" rx="6" fill="none" stroke="#f0a500" stroke-width="12"/>
  <line x1="218" y1="315" x2="310" y2="315" stroke="#f0a500" stroke-width="14" stroke-linecap="round"/>
</svg>
